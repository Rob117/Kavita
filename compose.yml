services:
  postgres:
    image: postgres
    ports:
      - 5432:5432
    volumes:
      - ./apps/postgres:/var/lib/postgresql
    environment:
      - POSTGRES_PASSWORD=goodpass
      - POSTGRES_USER=user_san
      - POSTGRES_DB=database_chan
  kavita:
    image: kavita
    ports:
      - 80:5000
    depends_on:
      - postgres
    volumes:
      - ~/Downloads/frieren/total:/manga
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=database_chan
      - DB_USER=user_san
      - DB_PASSWORD=goodpass
